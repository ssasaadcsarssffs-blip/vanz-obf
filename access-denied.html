<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | V-Secure</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <div class="access-denied-screen" style="display: flex;">
        <div class="lock-icon-wrapper">
            <i class="fa-solid fa-lock lock-icon"></i>
        </div>
        <div class="denied-title">ACCESS DENIED</div>
        <div class="denied-desc">
            Halaman ini dilindungi oleh protokol sistem keamanan tinggi <strong>V-Secure</strong>.<br>
            Akses langsung melalui Browser atau perangkat luar tidak diizinkan. Hanya permintaan resmi dari <strong>Roblox Client Engine</strong> yang diperbolehkan.
        </div>
        <div class="client-badge">
            &lt;/&gt; HANYA CLIENT ROBLOX YANG DAPAT MENGAKSES KODE INI
        </div>
    </div>

</body>
</html>
